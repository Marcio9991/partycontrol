<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PartyControl</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topo">
    <h1>PartyControl</h1>
    <p>Controle de agendamento do salão de festa</p>
  </header>

  <main class="conteudo">
    <div id="mensagem" class="mensagem" role="status" aria-live="polite"></div>

    <section class="cartao" aria-labelledby="titulo-form">
      <h2 id="titulo-form">Novo agendamento</h2>
      <form id="form-agendamento" novalidate>
        <input type="hidden" id="id">

        <div class="grade">
          <div class="campo">
            <label for="cliente">Cliente</label>
            <input type="text" id="cliente" maxlength="100" required>
          </div>
          <div class="campo">
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" placeholder="(45) 99999-9999" required>
          </div>
          <div class="campo">
            <label for="tipo_evento">Tipo de evento</label>
            <input type="text" id="tipo_evento" maxlength="60" placeholder="Aniversário, casamento..." required>
          </div>
          <div class="campo">
            <label for="data_evento">Data</label>
            <input type="date" id="data_evento" required>
          </div>
          <div class="campo">
            <label for="hora_inicio">Início</label>
            <input type="time" id="hora_inicio" required>
          </div>
          <div class="campo">
            <label for="hora_fim">Término</label>
            <input type="time" id="hora_fim" required>
          </div>
          <div class="campo">
            <label for="convidados">Convidados</label>
            <input type="number" id="convidados" min="0" step="1" value="0">
          </div>
          <div class="campo">
            <label for="valor">Valor (R$)</label>
            <input type="number" id="valor" min="0" step="0.01" value="0">
          </div>
          <div class="campo">
            <label for="status">Status</label>
            <select id="status">
              <option value="pendente">Pendente</option>
              <option value="confirmado">Confirmado</option>
              <option value="cancelado">Cancelado</option>
            </select>
          </div>
        </div>

        <div class="campo">
          <label for="observacoes">Observações</label>
          <textarea id="observacoes" rows="3" maxlength="500"></textarea>
        </div>

        <div class="acoes">
          <button type="submit" id="btn-salvar" class="btn btn-primario">Cadastrar agendamento</button>
          <button type="button" id="btn-cancelar" class="btn btn-secundario" hidden>Cancelar edição</button>
        </div>
      </form>
    </section>

    <section class="cartao" aria-labelledby="titulo-lista">
      <div class="cabecalho-lista">
        <h2 id="titulo-lista">Agendamentos</h2>
        <div class="filtros">
          <div class="campo">
            <label for="filtro-data">Data</label>
            <input type="date" id="filtro-data">
          </div>
          <div class="campo">
            <label for="filtro-status">Status</label>
            <select id="filtro-status">
              <option value="">Todos</option>
              <option value="pendente">Pendente</option>
              <option value="confirmado">Confirmado</option>
              <option value="cancelado">Cancelado</option>
            </select>
          </div>
          <button type="button" id="btn-limpar-filtros" class="btn btn-secundario">Limpar</button>
        </div>
      </div>

      <div class="tabela-wrap">
        <table>
          <caption class="sr-only">Lista de agendamentos do salão</caption>
          <thead>
            <tr>
              <th scope="col">Data</th>
              <th scope="col">Horário</th>
              <th scope="col">Cliente</th>
              <th scope="col">Evento</th>
              <th scope="col">Convidados</th>
              <th scope="col">Valor</th>
              <th scope="col">Status</th>
              <th scope="col">Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-corpo"></tbody>
        </table>
      </div>
      <p id="vazio" class="vazio" hidden>Nenhum agendamento encontrado.</p>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
