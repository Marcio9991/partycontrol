<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PartyControl - Entrar</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="pagina-login">
  <main class="cartao cartao-login">
    <h1>PartyControl</h1>
    <p class="subtitulo">Entre com seu e-mail do Gmail</p>

    <div id="mensagem" class="mensagem" role="alert" aria-live="assertive"></div>

    <form id="form-login" novalidate>
      <div class="campo">
        <label for="email">E-mail (Gmail)</label>
        <input type="email" id="email" placeholder="seunome@gmail.com" autocomplete="email" autofocus required>
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" autocomplete="current-password" required>
      </div>
      <button type="submit" id="btn-entrar" class="btn btn-primario btn-bloco">Entrar</button>
    </form>

    <p class="links-auth">
      Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a><br>
      <a href="index.html">Voltar ao início</a>
    </p>
  </main>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
